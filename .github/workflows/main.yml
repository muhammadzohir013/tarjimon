name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          pip install flet deep-translator
      - name: Build APK
        run: |
          flet build apk tarjimon3.py
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: mening-ilovam
          path: build/apk/*.apk
